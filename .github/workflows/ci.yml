name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, tests y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Levantar dynamodb-test
        run: docker compose up -d dynamodb-test

      - name: Esperar a que dynamodb-test responda
        run: |
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8001; then
              echo "dynamodb-test lista"
              exit 0
            fi
            sleep 2
          done
          echo "dynamodb-test no respondió a tiempo"
          docker compose logs dynamodb-test
          exit 1

      - name: Build, pruebas y verificación de cobertura
        run: ./mvnw -B -ntp verify

      - name: Publicar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes
          path: |
            target/site/jacoco/
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Enviar cobertura a Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: target/site/jacoco/jacoco.xml
          format: jacoco
          base-path: src/main/java
          fail-on-error: false

      - name: Detener contenedores
        if: always()
        run: docker compose down

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Construir la imagen (sin publicarla)
        run: docker build --tag franchises-api:ci .

      - name: Comprobar que la imagen no corre como root
        run: test "$(docker image inspect franchises-api:ci --format '{{.Config.User}}')" = "app"
