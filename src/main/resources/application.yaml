spring:
  application:
    name: franchises-api
  profiles:
    default: dev

app:
  dynamodb:
    region: us-east-1
    table-name: franchises
    create-table: false
  # Migraciones de datos versionadas: se aplican al arrancar, antes de marcar la app como lista.
  # lock-ttl debe superar la duración de la migración más larga.
  migrations:
    enabled: true
    lock-ttl: 5m

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
