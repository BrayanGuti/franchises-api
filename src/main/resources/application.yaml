spring:
  application:
    name: franchises-api
  profiles:
    default: dev

app:
  dynamodb:
    region: us-east-1
    table-name: franchises
    create-table: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
