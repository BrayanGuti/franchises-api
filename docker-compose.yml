name: franchises-api

# Todos los puertos se publican solo en 127.0.0.1: DynamoDB Local acepta cualquier credencial
# y dynamodb-admin no tiene autenticación, así que no deben quedar expuestos a la red.

services:
  # Base de desarrollo: datos persistentes en un volumen
  dynamodb-dev:
    image: amazon/dynamodb-local:3.3.2
    container_name: franchises-dynamodb-dev
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    user: root
    working_dir: /home/dynamodblocal
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dynamodb-dev-data:/home/dynamodblocal/data

  # Base exclusiva para las pruebas: en memoria, se pierde al detenerla
  dynamodb-test:
    image: amazon/dynamodb-local:3.3.2
    container_name: franchises-dynamodb-test
    command: -jar DynamoDBLocal.jar -sharedDb -inMemory
    working_dir: /home/dynamodblocal
    ports:
      - "127.0.0.1:8001:8000"

  # Interfaz web para inspeccionar dynamodb-dev (tablas, ítems, claves PK/SK).
  # Arranca con el perfil tools (solo el inspector) o con el perfil app (todo el entorno).
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:5.3.4
    container_name: franchises-dynamodb-admin
    profiles: [tools, app]
    depends_on:
      - dynamodb-dev
    environment:
      # Siempre explícito: sin endpoint, el cliente podría intentar conectarse a AWS real
      DYNAMO_ENDPOINT: http://dynamodb-dev:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "127.0.0.1:8002:8001"

  # La API empaquetada con el Dockerfile, contra dynamodb-dev.
  # Arranca todo el entorno con:  docker compose --profile app up -d --build
  app:
    build: .
    image: franchises-api:local
    container_name: franchises-api
    profiles: [app]
    depends_on:
      - dynamodb-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Dentro de la red de compose la base se llama dynamodb-dev, no localhost
      APP_DYNAMODB_ENDPOINT: http://dynamodb-dev:8000
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  dynamodb-dev-data:
